<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detectives de fuentes</title>
<style>
:root{--bg:#2a1650;--p:#6d3fc0;--l:#e6d9ff;--y:#ffcf33;--w:#fff;--ok:#2fbf71;--bad:#e5534b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(160deg,#2a1650,#4b2a8c);color:var(--w);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1d0f3acc;backdrop-filter:blur(6px)}
#bar{flex:1;height:10px;background:#ffffff26;border-radius:9px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--y);transition:width .5s}
#xp{font-weight:700;color:var(--y);white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
main.in{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:2.3rem;margin:.2em 0;color:var(--y);text-align:center}h2{color:var(--y);margin:.3em 0}
.hero{font-size:3.2rem;text-align:center;letter-spacing:8px;animation:fl 3s infinite ease-in-out}@keyframes fl{50%{transform:translateY(-8px)}}
.lead{text-align:center;font-size:1.15rem;color:var(--l)}
.card{background:var(--w);color:#26143f;border-radius:14px;padding:14px 16px;margin:12px 0;border-left:6px solid var(--y)}
.card.alt{border-left-color:var(--p)}
.tag{display:inline-block;background:var(--y);color:#2a1650;font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:99px}
mark{background:var(--y);padding:0 4px;border-radius:4px}
.btn,.opt{display:block;width:100%;font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer;transition:transform .15s,background .2s}
.btn{background:var(--y);color:#2a1650}.btn:hover,.opt:hover{transform:scale(1.02)}
.btn.ghost{background:#ffffff1f;color:#fff}
.opt{background:var(--l);color:#2a1650;text-align:left}.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}.opt.sel{outline:3px solid var(--y)}
button[disabled]{opacity:.4;pointer-events:none}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--l);margin:14px 0 6px;text-align:center}
.q{background:#ffffff14;border-radius:14px;padding:6px 14px 10px;margin:14px 0}.fb{min-height:1.4em;color:var(--l)}
.nav{display:flex;gap:10px;margin-top:18px}
.map{display:grid;grid-template-columns:1fr;gap:8px}
.st{display:flex;gap:12px;align-items:center;text-align:left;background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.st b.l{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--y);color:#2a1650;font-size:1.5rem;flex:none}
.st.done{background:var(--ok)}.st small{display:block;color:var(--l)}
table{width:100%;border-collapse:collapse;background:#fff;color:#26143f;border-radius:12px;overflow:hidden}
td,th{padding:8px;border-bottom:1px solid #e6d9ff;text-align:left;font-size:.92rem}th{background:var(--l)}
.big{font-size:3rem;font-weight:800;text-align:center;color:var(--y)}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}#modal[hidden]{display:none}
#modal .box{background:#fff;color:#26143f;border-radius:16px;padding:18px;max-width:520px;max-height:88vh;overflow:auto;animation:in .3s}
.row{display:flex;gap:8px}details{background:#fff;color:#26143f;border-radius:12px;margin:8px 0;padding:10px 14px;border-left:6px solid var(--y)}summary{cursor:pointer;font-weight:700}.row .opt{text-align:center;padding:8px 4px}
@media print{body *{visibility:hidden}#modal,#modal *{visibility:visible}#modal{position:absolute;background:#fff}.no{display:none}}
</style></head><body>
<div id="top"><div id="bar"><i id="fill"></i></div><span id="xp"></span></div>
<main id="app"></main><div id="modal" hidden></div>
<script>
const S={n:"",ch:null,step:0,ans:{},seen:{},calc:false},Z={};
const ST={C:["c"],R:["r"],A:["a"],X:["x"],P:["p1","p2","p3"]};
const K=[["C","Actualidad",0,"Sin fecha clara: la noticia tiene 3 años"],["R","Relevancia",1,"Tema cercano, pero demasiado vago"],["A","Autoridad",0,"Cuenta anónima, sin institución"],["X","Exactitud",0,"Sin fuente y contradice el comunicado"],["P","Propósito",0,"Busca clics y compartidos"]];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const ready=k=>ST[k].every(i=>S.ans[i]!==undefined);
const all=()=>Object.keys(ST).every(ready);
const go=n=>{S.step=n;render(1);scrollTo(0,0)};
const pick=c=>{S.ch=c;go(2)};
const ans=(i,k)=>{if(S.ans[i]!==undefined)return;S.ans[i]=k;const y=scrollY;render();scrollTo(0,y)};
const modal=h=>{const m=document.getElementById("modal");m.innerHTML=`<div class=box>${h}<button class="btn no" onclick="document.getElementById('modal').hidden=true">Cerrar</button></div>`;m.hidden=false};
const nav=(p,n,l,d)=>`<div class=nav>${p!=null?`<button class="btn ghost" onclick="go(${p})">← Atrás</button>`:""}${n!=null?`<button class=btn ${d?"disabled":""} onclick="go(${n})">${l||"Siguiente →"}</button>`:""}</div>`;
const q=(id,t,o)=>{Z[id]=o;const a=S.ans[id];return `<div class=q><p><b>${t}</b></p>${o.map((x,i)=>`<button class="opt ${a===undefined?"":x[1]?"ok":i===a?"bad":""}" onclick="ans('${id}',${i})">${x[0]}</button>`).join("")}<p class=fb>${a===undefined?"":(o[a][1]?"✅ ¡Correcto! "+o[a][2]:"❌ Por qué está mal: "+o[a][2]+"<br>✅ La respuesta correcta es: <b>"+o.find(x=>x[1])[0]+"</b>. "+o.find(x=>x[1])[2])}</p></div>`};
const post=(t,b)=>`<div class=card><span class=tag>${t}</span><p>${b}</p></div>`;
const SC=[
()=>`<div class=hero>🕵️📄🔎👣</div><h1>Detectives de fuentes</h1><p class=lead>“En 15 minutos aprenderás a desenmascarar una fuente.”</p><input placeholder="Nombre del equipo" value="${esc(S.n)}" oninput="S.n=this.value"><button class=btn onclick="go(9)">Empezar la misión 🔎</button>`,
()=>`<span class=tag>EXPEDIENTE #001 · SIMULACIÓN</span><h2>El caso</h2>${post("Publicación viral (ejemplo ficticio)","“Una universidad eliminará todos sus exámenes a partir del próximo mes.” Compartida miles de veces. No muestra fuentes oficiales.")}<p><b>¿Utilizarías esta noticia en un trabajo escolar?</b></p><button class=opt onclick="pick('si')">Sí, la utilizaría.</button><button class=opt onclick="pick('no')">No, primero la investigaría.</button><p class=fb>Tu decisión quedará guardada hasta el veredicto.</p>`,
()=>`<h2>🗺️ Mapa CRAAP</h2><p class=lead>${S.n?"Equipo "+esc(S.n)+": ":""}investiga las 5 estaciones.</p><div class=map>${[["C","C","Currency · Actualidad","¿Está actualizada?",3,"C"],["R","R","Relevance · Relevancia","¿Sirve para el tema?",3,"R"],["A","A","Authority · Autoridad","¿Quién la creó?",4,"A"],["A","A","Accuracy · Exactitud","¿Es correcta y comprobable?",5,"X"],["P","P","Purpose · Propósito","¿Con qué intención?",6,"P"]].map(s=>`<button class="st ${ready(s[5])?"done":""}" onclick="go(${s[4]})"><b class=l>${ready(s[5])?"✓":s[1]}</b><span><b>${s[2]}</b><small>${s[3]}</small></span></button>`).join("")}</div>${nav(1,7,"Ir al veredicto ⚖️",!all())}`,
()=>`<h2>Estaciones 1 y 2</h2><div class=card><b>C · Actualidad:</b> ¿cuándo se publicó y sigue vigente? <b>R · Relevancia:</b> ¿responde a tu tema y a tu nivel?</div>${post("Captura simulada","“Universidad eliminará todos sus exámenes el próximo mes”<br><small>Publicado: <mark>hace 3 años</mark> · 12 mil compartidos</small>")}${q("c","¿La fecha de publicación es reciente?",[["Sí, tiene miles de compartidos",0,"Que se haya compartido mucho solo mide popularidad, no si la información está vigente."],["No: habla del “próximo mes” pero tiene 3 años",1,"La fecha y el contenido no cuadran."],["No importa la fecha en noticias",0,"Si la información cambia con el tiempo (como las normas de una universidad), una fecha vieja la vuelve poco confiable."]])}${q("r","Tu tema es el sistema de evaluación de tu carrera. La publicación no nombra universidad ni carrera. ¿Es relevante?",[["Sí, habla de universidades",0,"Mencionar universidades no basta: no dice cuál ni qué carrera, así que no te sirve para tu tema."],["Solo parcialmente: es demasiado vaga",1,"Roza el tema, pero sin datos útiles."],["Nada que ver",0,"Sí se relaciona con la evaluación universitaria, aunque de forma muy vaga; descartarla del todo sería exagerado."]])}${nav(2,2,"Volver al mapa",!(ready("C")&&ready("R")))}`,
()=>`<h2>Estación 3 · Autoridad</h2><div class=card>Pregúntate quién escribe, qué experiencia tiene y qué institución lo respalda.</div>${post("Noticia de ejemplo","“¡Adiós a los exámenes!” — publicado por <b>@ExamenesFuera_YA</b>")}<button class=btn onclick="modal('<h3>🗂️ Ficha del autor (ficticia)</h3><p>Perfil creado hace 2 semanas.<br>Sin nombre real ni institución.<br>0 publicaciones previas sobre educación.</p>')">Descubre al autor</button><div class=card alt><b>Lectura lateral:</b> en vez de leer más en la misma página, abre otras pestañas y busca qué dicen otras fuentes sobre el autor o el medio.</div>${q("a","¿Qué haces primero para comprobar su autoridad?",[["Leer más publicaciones del mismo perfil",0,"Quedarte en el mismo perfil es lectura vertical: solo escuchas lo que el propio autor dice de sí mismo."],["Salir de la página y buscar qué dicen otras fuentes de él",1,"Es la lectura lateral."],["Fijarme en cuántos seguidores tiene",0,"Los seguidores se pueden conseguir con contenido viral o comprarse; no demuestran conocimiento ni respaldo."]])}${nav(2,2,"Volver al mapa",!ready("A"))}`,
()=>{const v=S.seen.v,o=S.seen.o;return `<h2>Estación 4 · Exactitud</h2><div class=row><button class="btn ghost" onclick="S.seen.o=1;S.view='o';render()">Consultar fuente original</button><button class="btn ghost" onclick="S.seen.v=1;S.view='v';render()">Ver noticia viral</button></div>${S.view=="o"?post("Comunicado oficial (ficticio)","“Se pilotará un nuevo formato de evaluación en 2 asignaturas del próximo semestre. Los exámenes finales se mantienen.”"):S.view=="v"?post("Noticia viral (ficticia)","“Se eliminan TODOS los exámenes el próximo mes.” Fuente: ninguna."):"<p class=fb>Elige qué documento abrir.</p>"}${v&&o?`<table><tr><th>Dato</th><th>Viral</th><th>Original</th></tr><tr><td>Alcance</td><td>Todos</td><td>2 asignaturas</td></tr><tr><td>Cuándo</td><td>Próximo mes</td><td>Próximo semestre</td></tr><tr><td>Fuente</td><td>Ninguna</td><td>Comunicado</td></tr></table>`:""}${v&&o?q("x","Reto: Encuentra la referencia. ¿Qué afirmación está respaldada por evidencia?",[["“Todos los exámenes desaparecen”",0,"No cita ninguna fuente y contradice el comunicado oficial, así que no hay evidencia que la respalde."],["“Se pilotará un nuevo formato en 2 asignaturas”",1,"Está en un documento oficial verificable."],["“Miles de personas lo compartieron”",0,"Que mucha gente la comparta no prueba que sea verdadera: la evidencia son documentos o datos verificables."]]):"<p class=fb>Consulta ambos documentos para desbloquear el reto.</p>"}${nav(2,2,"Volver al mapa",!ready("X"))}`},
()=>{const T=[["Anuncio","Información","Opinión"]];const L=["un anuncio","información periodística","una opinión"];const p=(id,t,k,e)=>q(id,"“"+t+"”",T[0].map((x,i)=>[x,i==k,(i==k?"Es ":"No es ")+L[i]+" porque "+e+"."]));return `<h2>Estación 5 · Propósito</h2><div class=card>Hay publicidad, información, opinión y <b>contenido patrocinado</b> (pagado, pero disfrazado de nota). Los sitios ganan dinero con visitas y anuncios: cada vez que compartes sin leer, alguien cobra.</div><span class=tag>EJEMPLOS FICTICIOS</span>${p("p1","¡Últimas plazas! Curso exprés con 70% de descuento. ¡Compra hoy!",0,"invita a comprar con descuento y urgencia")}${p("p2","El consejo académico aprobó el calendario (acta publicada).",1,"informa un hecho comprobable y cita su fuente, el acta")}${p("p3","Los exámenes ya no sirven y deberían desaparecer.",2,"expresa un juicio personal sin datos ni fuentes")}${nav(2,2,"Volver al mapa",!ready("P"))}`},
()=>{const t=K.reduce((a,k)=>a+k[2],0),d=t>=8?["Se puede citar","✅"]:t>=5?["Se debe contrastar","🟡"]:["Se debe descartar","🚫"];return `<h2>⚖️ Veredicto</h2><table><tr><th>Criterio</th><th>Hallazgo</th><th>Pts</th></tr>${K.map(k=>`<tr><td>${k[0]} ${k[1]}</td><td>${k[3]}</td><td>${k[2]}/2</td></tr>`).join("")}</table>${S.calc?`<div class=big>${t}/10</div><div class=card><b>${d[1]} ${d[0]}</b><br>8–10 se puede citar · 5–7 se debe contrastar · 0–4 se debe descartar</div><p>${S.ch=="no"?"🎯 Coincide con tu decisión inicial: investigar antes de usarla fue lo correcto.":"⚠️ Dijiste que la usarías, pero el veredicto la descarta. ¡Investigar antes te habría ahorrado un error!"}</p>`:`<button class=btn onclick="S.calc=true;render()">Calcular puntaje 🧮</button>`}${nav(2,8,"Reto final 🏁",!S.calc)}`},
()=>{const f=[...Array(5)].map((_,i)=>"f"+(i+1)),d=f.every(i=>S.ans[i]!==undefined),sc=f.filter(i=>Z[i]&&Z[i][S.ans[i]][1]).length;return `<h2>🏁 Reto final</h2>${post("Noticia nueva · EJEMPLO FICTICIO","<b>Boletín Aurora</b> · 14 mar 2019<br>“Un estudio prueba que dormir 4 horas mejora las notas”. Por “Dr. Sano”, sin institución. Banner: “¡Compra YA el suplemento ZZ!”. No enlaza el estudio.")}${q("f1","1. ¿Está actualizada? (tema científico, 2019)",[["Sí, la ciencia no cambia",0,"En ciencia los resultados se revisan y se corrigen; una nota de 2019 puede estar superada."],["No: conviene buscar evidencia más reciente",1,"Tiene años de antigüedad."],["Sí, si es popular",0,"Que sea popular no la hace vigente; la actualidad se comprueba con la fecha y con estudios recientes."]])}${q("f2","2. Tu trabajo trata sobre hábitos de estudio universitarios. ¿Es relevante?",[["Totalmente",0,"La nota no menciona a universitarios, así que no es totalmente relevante para tu población."],["Parcial: cercana, pero sin datos de tu población",1,"Es tema próximo, no específico."],["Nada",0,"Sí hay relación parcial (sueño y notas), por eso no es nula."]])}${q("f3","3. ¿Qué autoridad tiene el autor?",[["Alta, es “Dr.”",0,"Un “Dr.” sin institución ni credenciales verificables no demuestra experiencia."],["Baja: sin institución ni credenciales verificables",1,"No se puede comprobar."],["Alta, escribe bien",0,"Escribir bien no demuestra conocimiento ni respaldo en el tema."]])}${q("f4","4. ¿Los datos están respaldados?",[["Sí, menciona un estudio",0,"Mencionar un estudio sin enlazarlo ni citarlo no permite verificarlo."],["No: no enlaza el estudio, no es verificable",1,"Falta la fuente primaria."],["Sí, porque suena científico",0,"Que suene científico no es evidencia; hace falta la fuente primaria."]])}${q("f5","5. ¿Cuál es su propósito?",[["Informar de forma neutral",0,"El banner de compra muestra un interés comercial, así que no es neutral."],["Entretener",0,"Nada en la nota busca entretener; el banner apunta a vender."],["Probablemente vender un suplemento",1,"El banner revela el interés comercial."]])}${d?`<div class=card><div class=big style="color:#6d3fc0">${sc}/5</div><b>${sc>=4?"🏆 ¡Misión cumplida, detective!":"🔁 Misión incompleta: repasa las estaciones."}</b><p>Verificar fuentes protege tu trabajo y evita que difundas desinformación.</p><b>3 consejos:</b><br>1. Haz lectura lateral.<br>2. Busca la fuente primaria.<br>3. Desconfía de lo que apela solo a emociones.</div><button class=btn onclick="ficha()">📄 Ver ficha imprimible CRAAP</button>`:""}${nav(7,null)}`}
];
SC[9]=()=>`<span class=tag>BRIEFING DE LA MISIÓN</span><h2>📚 ¿Qué es el método CRAAP?</h2><div class=card>Es una lista de cinco criterios para decidir si una fuente es confiable. Su nombre viene de las iniciales en inglés de cada criterio. Toca cada letra para ver qué revisa.</div>${[["C","Currency · Actualidad","¿Cuándo se publicó o se actualizó? ¿Sigue vigente para tu tema? ¿Los enlaces funcionan?"],["R","Relevance · Relevancia","¿Responde a tu pregunta de investigación? ¿Para qué público está escrita? ¿Su nivel sirve para un trabajo universitario?"],["A","Authority · Autoridad","¿Quién es el autor? ¿Qué formación o experiencia tiene? ¿Qué institución lo respalda? ¿Hay datos de contacto?"],["A","Accuracy · Exactitud","¿Cita fuentes o evidencias? ¿Puedes comprobar los datos en otro lugar? ¿Está bien redactada, sin errores?"],["P","Purpose · Propósito","¿Busca informar, enseñar, vender, persuadir o entretener? ¿Es objetiva o tiene intereses ocultos?"]].map(s=>`<details><summary>${s[0]} · ${s[1]}</summary><p>${s[2]}</p></details>`).join("")}<div class=card>🎮 <b>Cómo se juega:</b> investigarás un caso viral en 5 estaciones y ganarás puntos por cada acierto. Si te equivocas, verás por qué esa respuesta está mal y cuál era la correcta. Al final recibirás un veredicto y un reto final.</div>${nav(0,1,"Aceptar el caso 🔎")}`;
function ficha(){modal(`<h3>Ficha CRAAP</h3><p><b>C · Actualidad:</b> ¿La información está actualizada?<br><b>R · Relevancia:</b> ¿Es útil para mi tema?<br><b>A · Autoridad:</b> ¿Quién la creó y qué respaldo tiene?<br><b>A · Exactitud:</b> ¿Es correcta y comprobable?<br><b>P · Propósito:</b> ¿Con qué intención se publicó?</p><button class="btn no" onclick="window.print()">🖨️ Imprimir</button>`)}
function render(a){const m=document.getElementById("app");m.innerHTML=SC[S.step]();m.className=a?"in":"";document.getElementById("fill").style.width=(S.step==9?0:S.step)/8*100+"%";document.getElementById("xp").textContent="🔎 "+Object.keys(S.ans).filter(k=>Z[k]&&Z[k][S.ans[k]][1]).length+" pts"}
render(1);
</script></body></html>
